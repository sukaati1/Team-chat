<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Aplikasi Tchat</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 20px auto; }
        #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 8px; }
        .input-group { display: flex; gap: 5px; }
        input { flex: 1; padding: 8px; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Room Chat</h2>
    
    <!-- Wadah pesan -->
    <div id="chat-box"></div>

    <!-- Input dan Tombol -->
    <div class="input-group">
        <input type="text" id="message-input" placeholder="Tulis pesan...">
        <button onclick="sendMessage()">Kirim</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();

            if (message !== '') {
                const chatBox = document.getElementById('chat-box');
                
                // Buat elemen pesan baru
                const newMessage = document.createElement('div');
                newMessage.className = 'message';
                newMessage.textContent = 'Kamu: ' + message;
                
                // Tampilkan di layar
                chatBox.appendChild(newMessage);
                
                // Kosongkan kolom input
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>

</body>
</html>
