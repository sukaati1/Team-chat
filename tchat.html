<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>T'chat Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    
<style>
    :root {
        color-scheme: only dark !important;
        --blue-electric: #00d2ff;
        --purple-neon: #a855f7;
        --purple-bright: #d8b4fe;
        --pink-neon: #ff007f;
        --cyan-neon: #00f0ff;
        
        --lavender-bg: rgba(147, 112, 219, 0.15); 
        --lavender-border: #c89eff;               
        --lavender-text: #e8d7ff;                 
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #030308;
        overflow-x: hidden;
    }

    body {
        padding: 20px 15px;
        font-family: 'Rajdhani', sans-serif;
        color: #ffffff !important;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
        pointer-events: none;
    }

    /* MODAL OVERLAY UMUM */
    .chat-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    #profileModal, #registerModal, #friendsModal {
        z-index: 1002 !important;
    }

    #imageViewerModal {
        z-index: 1003 !important;
    }

    /* MODAL AUTH (LOGIN KHUSUS) */
    .auth-modal {
        position: relative;
        width: 100%;
        max-width: 420px;
        background: rgba(5, 5, 8, 0.95) !important;
        border-radius: 20px !important;
        border: 2px solid var(--lavender-border) !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .auth-input-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .auth-input-group label {
        font-size: 9.5px;
        font-family: 'Orbitron', sans-serif;
        font-weight: 800;
        color: var(--purple-bright);
        letter-spacing: 1px;
    }

    .auth-input-group input {
        background: rgba(20, 20, 28, 0.9) !important;
        border: 1px solid rgba(168, 85, 247, 0.4) !important;
        color: #fff !important;
        padding: 10px 12px;
        border-radius: 10px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        outline: none;
    }

    .auth-input-group input:focus {
        border-color: var(--cyan-neon) !important;
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    button {
        position: relative;
        overflow: hidden;
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;    
        font-weight: 900;
        cursor: pointer;
        letter-spacing: 2px;
        text-transform: uppercase;
        outline: none;
        border-radius: 35px !important;
        border: 2px solid var(--lavender-border) !important;
        background: var(--lavender-bg) !important;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        color: var(--lavender-text) !important;
        text-shadow: 0 0 6px rgba(181, 126, 220, 0.6);
        box-shadow: 0 0 12px rgba(200, 158, 255, 0.5);
        transition: transform 0.1s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    button:hover {
        background: rgba(147, 112, 219, 0.35) !important;
        border-color: #ffffff !important;
        box-shadow: 0 0 20px #b57edc;
    }

    button:active {
        transform: scale(0.96) !important;
    }

    /* EDIT PROFIL MODAL STYLES */
    .avatar-selection-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 5px;
        margin-bottom: 5px;
    }

    .avatar-preview-img {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--cyan-neon);
        box-shadow: 0 0 10px var(--cyan-neon);
    }

    .btn-upload-avatar {
        font-size: 10px !important;
        padding: 6px 12px !important;
        border-radius: 10px !important;
        margin-top: 2px;
    }

    .btn-auth-submit {
        padding: 12px !important;
        border-radius: 15px !important;
        margin-top: 10px;
    }

    .btn-admin-reg {
        background: rgba(255, 0, 127, 0.2) !important;
        border: 1px solid var(--pink-neon) !important;
        color: #ffffff !important;
        margin-top: 5px;
    }

    .auth-close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: transparent !important;
        border: none !important;
        color: var(--pink-neon) !important;
        font-size: 18px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: none !important;
    }

    /* KOTAK CHAT UTAMA */
    .chat-modal {
        position: relative;
        width: 100%;
        max-width: 650px;
        height: 92vh;
        max-height: 750px;
        background: rgba(5, 5, 8, 0.95) !important;
        border-radius: 20px !important;
        border: 2px solid var(--lavender-border) !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
        z-index: 2;
    }

    .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(200, 158, 255, 0.2);
        padding-bottom: 10px;
        flex-shrink: 0;
    }

    .chat-header h3 {
        margin: 0;
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 20px;
        letter-spacing: 3px;
        text-transform: none !important;
        background: linear-gradient(
            90deg, 
            var(--cyan-neon), 
            var(--blue-electric), 
            var(--pink-neon), 
            var(--purple-neon), 
            var(--cyan-neon)
        );
        background-size: 200% auto;
        color: transparent !important;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shineText 3s linear infinite;
        filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.6));
    }

    @keyframes shineText {
        to { background-position: 200% center; }
    }

    .header-controls {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-hdr-action {
        font-size: 9.5px !important;
        padding: 6px 14px !important;
        border-radius: 15px !important;
        font-family: 'Orbitron', sans-serif;
        font-weight: 800;
        letter-spacing: 1px;
        cursor: pointer;
        box-shadow: none !important;
        transition: all 0.2s ease;
        flex: none !important;
    }

    .btn-reset-chat {
        background: rgba(255, 0, 127, 0.15) !important;
        border: 1px solid rgba(255, 0, 127, 0.4) !important;
        color: var(--pink-neon) !important;
    }

    .btn-logout-chat {
        background: rgba(0, 210, 255, 0.15) !important;
        border: 1px solid rgba(0, 210, 255, 0.4) !important;
        color: var(--cyan-neon) !important;
    }

    .btn-profile-chat {
        background: rgba(168, 85, 247, 0.15) !important;
        border: 1px solid rgba(168, 85, 247, 0.4) !important;
        color: var(--purple-bright) !important;
    }

    .btn-friends-chat {
        background: rgba(0, 255, 136, 0.15) !important;
        border: 1px solid rgba(0, 255, 136, 0.4) !important;
        color: #00ff88 !important;
    }

    .btn-reset-chat:hover { background: rgba(255, 0, 127, 0.35) !important; color: #ffffff !important; }
    .btn-logout-chat:hover { background: rgba(0, 210, 255, 0.35) !important; color: #ffffff !important; }
    .btn-profile-chat:hover { background: rgba(168, 85, 247, 0.35) !important; color: #ffffff !important; }
    .btn-friends-chat:hover { background: rgba(0, 255, 136, 0.35) !important; color: #ffffff !important; }

    /* AREA PESAN */
    .chat-body {
        flex: 1;
        overflow-y: auto;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 12px;
        background: #09090d !important;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .chat-msg-wrapper {
        display: flex;
        gap: 10px;
        width: 100%;
        align-items: flex-start;
    }

    .chat-msg-wrapper.other-msg { flex-direction: row; }
    .chat-msg-wrapper.own-msg { flex-direction: row-reverse; }

    .msg-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
        border: 1.5px solid var(--purple-bright);
        flex-shrink: 0;
        margin-top: 2px;
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .msg-avatar:hover {
        transform: scale(1.1);
        border-color: var(--cyan-neon);
    }

    .msg-content-container {
        display: flex;
        flex-direction: column;
        max-width: 80%;
    }

    .chat-msg-wrapper.own-msg .msg-content-container {
        align-items: flex-end;
    }

    .msg-header-info {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 3px;
        font-size: 10.5px;
        padding: 0 2px;
    }

    .chat-msg-wrapper.own-msg .msg-header-info {
        flex-direction: row-reverse;
    }

    .sender {
        font-weight: 800;
        font-family: 'JetBrains Mono', monospace;
        text-transform: uppercase;
    }

    .time-stamp {
        color: rgba(255, 255, 255, 0.4);
        font-size: 9.5px;
        font-family: 'JetBrains Mono', monospace;
    }

    .msg-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: 4px;
        margin-right: 4px;
        opacity: 0.6;
        transition: opacity 0.2s ease;
    }

    .chat-msg-wrapper:hover .msg-actions { opacity: 1; }

    .btn-action-msg {
        color: rgba(255, 255, 255, 0.7);
        cursor: pointer;
        font-size: 11px;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .btn-action-msg:hover {
        color: var(--cyan-neon);
        transform: scale(1.2);
    }

    /* GELEMBUNG CHAT */
    .chat-msg {
        position: relative;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        padding: 8px 12px;
        border-radius: 12px;
        user-select: text;
        word-break: break-word;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        width: fit-content;
        display: flex;
        flex-direction: column;
        line-height: 1.35;
    }

    .chat-msg-wrapper.other-msg .chat-msg {
        background: rgba(45, 45, 50, 0.9) !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        border-top-left-radius: 2px;
    }

    .chat-msg-wrapper.own-msg .chat-msg {
        background: rgba(65, 65, 72, 0.95) !important;
        border: 1px solid rgba(255, 255, 255, 0.25) !important;
        border-top-right-radius: 2px;
    }

    /* MEDIA PREVIEW DI CHAT */
    .chat-msg .chat-media-img {
        max-width: 220px;
        max-height: 220px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .chat-msg .chat-media-video {
        max-width: 240px;
        max-height: 220px;
        border-radius: 8px;
        margin-top: 4px;
        outline: none;
    }

    .msg-reactions-container {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
    }

    .chat-msg-wrapper.own-msg .msg-reactions-container {
        justify-content: flex-end;
    }

    .reaction-badge {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: rgba(20, 20, 30, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 2px 6px;
        font-size: 11px;
        cursor: pointer;
        user-select: none;
        transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .reaction-badge:hover {
        transform: scale(1.1);
        border-color: var(--cyan-neon);
    }

    .reaction-badge.active-user {
        background: rgba(0, 240, 255, 0.2);
        border-color: var(--cyan-neon);
    }

    .reaction-badge .reaction-count {
        font-size: 10px;
        color: var(--cyan-neon);
        font-weight: bold;
    }

    .reply-quote-box {
        background: rgba(0, 0, 0, 0.4);
        border-left: 3px solid var(--cyan-neon);
        padding: 3px 6px;
        border-radius: 4px;
        margin-bottom: 6px;
        font-size: 10px;
    }

    .reply-quote-box .reply-author {
        color: var(--cyan-neon);
        font-weight: bold;
        text-transform: uppercase;
    }

    .reply-quote-box .reply-text {
        color: rgba(255, 255, 255, 0.8);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
        display: block;
    }

    .chat-msg .msg-content {
        color: #f0f0f5 !important;
        white-space: pre-wrap;
        display: block;
    }

    .chat-msg .msg-sticker {
        font-size: 32px;
        display: block;
        text-align: center;
        filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
        padding: 2px 6px;
    }

    .chat-msg .msg-content a {
        color: var(--cyan-neon);
        text-decoration: underline;
    }

    .chat-msg .msg-content code {
        background: rgba(0, 0, 0, 0.3);
        color: var(--cyan-neon);
        padding: 1px 4px;
        border-radius: 3px;
        font-size: 11px;
    }

    .reply-preview-container {
        display: none;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 210, 255, 0.15);
        border-left: 3px solid var(--cyan-neon);
        padding: 4px 10px;
        border-radius: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        flex-shrink: 0;
    }

    .reply-preview-text {
        color: #ffffff;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        max-width: 90%;
    }

    .btn-cancel-reply {
        color: var(--pink-neon);
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
    }

    .sticker-picker-container {
        display: none;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
        background: rgba(16, 16, 24, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 8px;
        max-height: 100px;
        overflow-y: auto;
        flex-shrink: 0;
    }

    .sticker-item {
        font-size: 22px;
        text-align: center;
        cursor: pointer;
        padding: 2px;
        border-radius: 6px;
        transition: background 0.2s ease, transform 0.1s ease;
    }

    .sticker-item:hover {
        background: rgba(0, 210, 255, 0.25);
        transform: scale(1.2);
    }

    .chat-footer {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-shrink: 0;
    }

    .user-profile-thumb {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        object-fit: cover;
        border: 1.5px solid var(--cyan-neon);
        cursor: pointer;
    }

    .chat-footer input#chatUser {
        width: 100px;
        background: rgba(20, 20, 28, 0.9) !important;
        border: 1px solid rgba(168, 85, 247, 0.4) !important;
        color: var(--cyan-neon) !important;
        padding: 8px 10px;
        border-radius: 12px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        outline: none;
        height: 40px;
        text-transform: uppercase;
        font-weight: bold;
    }

    .chat-footer textarea#chatText {
        flex: 1;
        background: rgba(20, 20, 28, 0.9) !important;
        border: 1px solid rgba(168, 85, 247, 0.4) !important;
        color: #fff !important;
        padding: 8px 12px;
        border-radius: 12px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        outline: none;
        resize: none;
        height: 40px;
        max-height: 90px;
        line-height: 1.3;
    }

    .chat-footer input:focus, .chat-footer textarea:focus {
        border-color: var(--cyan-neon) !important;
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .btn-sticker-toggle, .btn-attach-media {
        width: 40px !important;
        padding: 0 !important;
        flex: none !important;
        border-radius: 12px !important;
        border: 1px solid rgba(168, 85, 247, 0.4) !important;
        background: rgba(20, 20, 28, 0.9) !important;
        color: #ffffff !important;
        font-size: 16px !important;
        cursor: pointer;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .btn-send-chat {
        padding: 0 16px !important;
        flex: none !important;
        border-radius: 12px !important;
        border: 1px solid var(--lavender-border) !important;
        background: var(--lavender-bg) !important;
        color: #ffffff !important;
        font-size: 11px !important;
        letter-spacing: 1px !important;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* MODAL PERTEMANAN & DM */
    .friends-nav-tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 8px;
        margin-bottom: 10px;
    }

    .tab-btn {
        flex: 1;
        padding: 8px !important;
        font-size: 10px !important;
        border-radius: 10px !important;
    }

    .tab-btn.active {
        background: var(--cyan-neon) !important;
        color: #000 !important;
        border-color: #fff !important;
    }

    .friends-list-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 250px;
        overflow-y: auto;
    }

    .friend-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(20, 20, 30, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 8px 12px;
        border-radius: 10px;
    }

    .friend-info {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .friend-name {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: bold;
    }

    .btn-action-friend {
        padding: 4px 8px !important;
        font-size: 9px !important;
        border-radius: 8px !important;
        flex: none !important;
    }

    .image-viewer-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    .image-viewer-modal img {
        max-width: 85vw;
        max-height: 80vh;
        border-radius: 15px;
        border: 2px solid var(--cyan-neon);
        box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
        object-fit: contain;
    }

    .image-viewer-username {
        margin-top: 15px;
        font-family: 'Orbitron', sans-serif;
        color: #ffffff;
        font-size: 16px;
        letter-spacing: 2px;
    }
</style>
</head>
<body>

<video class="bg-video" autoplay loop muted playsinline disablepictureinpicture>
    <source src="./gb.mp4" type="video/mp4">
</video>

<!-- KOTAK CHAT UTAMA -->
<div class="chat-modal" id="chatModal" style="display: none;">
    <div class="chat-header">
        <h3 id="chatTitleHeader">T'chat</h3>
        <div class="header-controls">
            <button class="btn-hdr-action btn-friends-chat" onclick="openFriendsModal()">TEMAN 🤝</button>
            <button class="btn-hdr-action btn-profile-chat" onclick="openProfileModal()">PROFIL</button>
            <button class="btn-hdr-action btn-logout-chat" onclick="logoutChat()">LOGOUT</button>
            <button class="btn-hdr-action btn-reset-chat" onclick="clearAllChat()">RESET</button>
        </div>
    </div>

    <div class="chat-body" id="chatLogs"></div>

    <div class="reply-preview-container" id="replyPreview">
        <div class="reply-preview-text" id="replyPreviewText">Balas: ...</div>
        <span class="btn-cancel-reply" onclick="cancelReply()">&times;</span>
    </div>

    <div class="sticker-picker-container" id="stickerPicker">
        <span class="sticker-item" onclick="sendSticker('🔥')">🔥</span>
        <span class="sticker-item" onclick="sendSticker('⚡')">⚡</span>
        <span class="sticker-item" onclick="sendSticker('🚀')">🚀</span>
        <span class="sticker-item" onclick="sendSticker('😎')">😎</span>
        <span class="sticker-item" onclick="sendSticker('👍')">👍</span>
        <span class="sticker-item" onclick="sendSticker('🎉')">🎉</span>
        <span class="sticker-item" onclick="sendSticker('💎')">💎</span>
        <span class="sticker-item" onclick="sendSticker('👾')">👾</span>
        <span class="sticker-item" onclick="sendSticker('🤖')">🤖</span>
        <span class="sticker-item" onclick="sendSticker('💀')">💀</span>
        <span class="sticker-item" onclick="sendSticker('💯')">💯</span>
        <span class="sticker-item" onclick="sendSticker('🎯')">🎯</span>
    </div>

<div class="chat-modal-overlay" id="friendsModal" style="display: none;">

<!-- VIEW FOTO FULLSIZE MODAL -->
<div class="image-viewer-modal" id="imageViewerModal" onclick="closeImageViewer()">
    <img id="fullsizeImage" src="" alt="Fullsize Avatar">
    <div class="image-viewer-username" id="fullsizeUsername">USERNAME</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const NAMA_ADMIN_RESMI = "JAKA SEMBUNG";

    let selectedReplyData = null; 
    let activeUser = null; 
    let tempEditAvatar = "";
    window.targetMsgKeyForReaction = null;

    let currentChatMode = "GLOBAL";
    let activeDMPartner = "";
    let activeRefPath = "team_chat_messages";

    const firebaseConfig = {
        databaseURL: "https://kasir-flop-chat-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    
    let dbChat = firebase.database().ref("team_chat_messages");
    const dbAccounts = firebase.database().ref("chat_accounts");
    const dbFriends = firebase.database().ref("user_friends");

    document.addEventListener("DOMContentLoaded", () => {
        const savedAccount = localStorage.getItem("chat_active_account");
        if (savedAccount) {
            const parsedAccount = JSON.parse(savedAccount);
            if (parsedAccount && parsedAccount.username) {
                activeUser = parsedAccount;
                closeAuthModal();
                openTeamChat();
            } else {
                localStorage.removeItem("chat_active_account");
                activeUser = null;
                openAuthModal();
            }
        } else {
            openAuthModal();
        }
    });

    function openAuthModal() {
        document.getElementById('authModal').style.display = 'flex';
        document.getElementById('chatModal').style.display = 'none';
    }

    function closeAuthModal() {
        document.getElementById('authModal').style.display = 'none';
    }

    function submitLogin() {
        const user = document.getElementById('loginUser').value.trim().toUpperCase();
        const pass = document.getElementById('loginPass').value.trim();

        if (!user || !pass) {
            alert("Nama dan Password wajib diisi!");
            return;
        }

        dbAccounts.child(user).once('value', (snapshot) => {
            if (snapshot.exists()) {
                const accData = snapshot.val();
                if (accData.password === pass) {
                    activeUser = { 
                        username: user,
                        avatar: accData.avatar || ("https://api.dicebear.com/7.x/bottts/svg?seed=" + user)
                    };
                    localStorage.setItem("chat_active_account", JSON.stringify(activeUser));
                    
                    document.getElementById('loginUser').value = '';
                    document.getElementById('loginPass').value = '';
                    
                    closeAuthModal();
                    openTeamChat();
                } else {
                    alert("🚫 AKSES DITOLAK (Password Salah)");
                }
            } else {
                alert("🚫 AKSES DITOLAK (User ID Tidak Ditemukan)");
            }
        });
    }

    function openRegisterModal() {
        if (!activeUser || activeUser.username !== NAMA_ADMIN_RESMI) {
            alert("🚫 AKSES DITOLAK! Hanya Admin yang dapat mendaftarkan akun baru.");
            return;
        }
        
        closeProfileModal();
        document.getElementById('regUser').value = '';
        document.getElementById('regPass').value = '';
        document.getElementById('registerModal').style.display = 'flex';
    }

    function closeRegisterModal() {
        document.getElementById('registerModal').style.display = 'none';
    }

    function submitRegisterNewUser() {
        if (!activeUser || activeUser.username !== NAMA_ADMIN_RESMI) {
            alert("🚫 AKSES DITOLAK!");
            return;
        }

        const newUser = document.getElementById('regUser').value.trim().toUpperCase();
        const newPass = document.getElementById('regPass').value.trim();

        if (!newUser || !newPass) {
            alert("Username dan Password baru tidak boleh kosong!");
            return;
        }

        dbAccounts.child(newUser).once('value', (snapshot) => {
            if (snapshot.exists()) {
                alert("❌ Username tersebut sudah digunakan!");
            } else {
                dbAccounts.child(newUser).set({
                    password: newPass,
                    avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=" + newUser,
                    createdAt: new Date().toISOString()
                }, (error) => {
                    if (error) {
                        alert("Gagal membuat akun: " + error.message);
                    } else {
                        alert("✅ Berhasil membuat akun baru untuk: " + newUser);
                        closeRegisterModal();
                    }
                });
            }
        });
    }

    function openProfileModal() {
        if (!activeUser) return;
        tempEditAvatar = activeUser.avatar;
        document.getElementById('editAvatarPreview').src = tempEditAvatar;
        document.getElementById('editUserName').value = activeUser.username;
        document.getElementById('editUserPass').value = '';
        
        const regBtn = document.getElementById('btnAdminOpenReg');
        if (activeUser.username === NAMA_ADMIN_RESMI) {
            regBtn.style.display = 'block';
        } else {
            regBtn.style.display = 'none';
        }

        document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfileModal() {
        document.getElementById('profileModal').style.display = 'none';
    }

    function handleEditAvatarUpload(event) {
        const file = event.target.files[0];
        if (file) {
            if (file.size > 500 * 1024) { 
                alert("Ukuran foto terlalu besar! Maksimal 500 KB.");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                tempEditAvatar = e.target.result;
                document.getElementById('editAvatarPreview').src = tempEditAvatar;
            };
            reader.readAsDataURL(file);
        }
    }

    function saveProfileChanges() {
        if (!activeUser) return;
        const newName = document.getElementById('editUserName').value.trim().toUpperCase();
        const newPass = document.getElementById('editUserPass').value.trim();

        if (!newName) {
            alert("Nama User tidak boleh kosong!");
            return;
        }

        const oldName = activeUser.username;

        dbAccounts.child(oldName).once('value', (snapshot) => {
            if (snapshot.exists()) {
                const currentData = snapshot.val();
                const updatedPass = newPass ? newPass : currentData.password;

                if (newName !== oldName) {
                    dbAccounts.child(newName).once('value', (checkSnap) => {
                        if (checkSnap.exists()) {
                            alert("Nama baru sudah digunakan pengguna lain!");
                        } else {
                            dbAccounts.child(newName).set({
                                password: updatedPass,
                                avatar: tempEditAvatar,
                                createdAt: currentData.createdAt || new Date().toISOString()
                            });
                            dbAccounts.child(oldName).remove();
                            
                            activeUser.username = newName;
                            activeUser.avatar = tempEditAvatar;
                            localStorage.setItem("chat_active_account", JSON.stringify(activeUser));
                            
                            updateChatHeaderProfile();
                            closeProfileModal();
                            alert("Profil berhasil diperbarui!");
                        }
                    });
                } else {
                    dbAccounts.child(oldName).update({
                        password: updatedPass,
                        avatar: tempEditAvatar
                    });
                    
                    activeUser.avatar = tempEditAvatar;
                    localStorage.setItem("chat_active_account", JSON.stringify(activeUser));
                    
                    updateChatHeaderProfile();
                    closeProfileModal();
                    alert("Profil berhasil diperbarui!");
                }
            }
        });
    }

    function updateChatHeaderProfile() {
        if (activeUser) {
            document.getElementById('chatUser').value = activeUser.username;
            document.getElementById('myChatAvatar').src = activeUser.avatar;
        }
    }

    function viewFullsizeImage(avatarUrl, username) {
        document.getElementById('fullsizeImage').src = avatarUrl;
        document.getElementById('fullsizeUsername').innerText = username;
        document.getElementById('imageViewerModal').style.display = 'flex';
    }

    function closeImageViewer() {
        document.getElementById('imageViewerModal').style.display = 'none';
    }

    function logoutChat() {
        if (confirm("Yakin ingin logout dari T'chat?")) {
            activeUser = null;
            localStorage.removeItem("chat_active_account");
            openAuthModal();
        }
    }

    function openFriendsModal() {
        if (!activeUser) return;
        document.getElementById('friendsModal').style.display = 'flex';
        switchFriendsTab('friends');
    }

    function closeFriendsModal() {
        document.getElementById('friendsModal').style.display = 'none';
    }

    function switchFriendsTab(tab) {
        document.getElementById('tabFriendsBtn').classList.remove('active');
        document.getElementById('tabRequestsBtn').classList.remove('active');
        document.getElementById('tabAddBtn').classList.remove('active');

        document.getElementById('tabFriendsContent').style.display = 'none';
        document.getElementById('tabRequestsContent').style.display = 'none';
        document.getElementById('tabAddContent').style.display = 'none';

        if (tab === 'friends') {
            document.getElementById('tabFriendsBtn').classList.add('active');
            document.getElementById('tabFriendsContent').style.display = 'flex';
            loadFriendsList();
        } else if (tab === 'requests') {
            document.getElementById('tabRequestsBtn').classList.add('active');
            document.getElementById('tabRequestsContent').style.display = 'flex';
            loadFriendRequests();
        } else if (tab === 'add') {
            document.getElementById('tabAddBtn').classList.add('active');
            document.getElementById('tabAddContent').style.display = 'flex';
        }
    }

    function sendFriendRequest() {
        const targetUser = document.getElementById('targetFriendUser').value.trim().toUpperCase();
        if (!targetUser) return alert("Masukkan User ID!");
        if (targetUser === activeUser.username) return alert("Tidak bisa menambahkan diri sendiri!");

        dbAccounts.child(targetUser).once('value', (snapshot) => {
            if (snapshot.exists()) {
                dbFriends.child(targetUser).child('requests').child(activeUser.username).set(true, (err) => {
                    if (!err) {
                        alert("✅ Permintaan pertemanan terkirim ke " + targetUser);
                        document.getElementById('targetFriendUser').value = '';
                    }
                });
            } else {
                alert("❌ User ID tidak ditemukan!");
            }
        });
    }

    function loadFriendsList() {
        const container = document.getElementById('tabFriendsContent');
        container.innerHTML = 'Loading...';

        dbFriends.child(activeUser.username).child('list').once('value', (snapshot) => {
            container.innerHTML = '';
            if (!snapshot.exists()) {
                container.innerHTML = '<div style="font-size:11px; text-align:center;">Belum ada teman.</div>';
                return;
            }

            snapshot.forEach((child) => {
                const friendName = child.key;
                const card = document.createElement('div');
                card.className = 'friend-card';
                card.innerHTML = `
                    <div class="friend-info">
                        <span class="friend-name">${friendName}</span>
                    </div>
                    <button class="btn-action-friend" onclick="startPrivateChat('${friendName}')">CHAT PRIVATE 💬</button>
                `;
                container.appendChild(card);
            });
        });
    }

    function loadFriendRequests() {
        const container = document.getElementById('tabRequestsContent');
        container.innerHTML = 'Loading...';

        dbFriends.child(activeUser.username).child('requests').once('value', (snapshot) => {
            container.innerHTML = '';
            if (!snapshot.exists()) {
                container.innerHTML = '<div style="font-size:11px; text-align:center;">Tidak ada permintaan.</div>';
                return;
            }

            snapshot.forEach((child) => {
                const requester = child.key;
                const card = document.createElement('div');
                card.className = 'friend-card';
                card.innerHTML = `
                    <div class="friend-info">
                        <span class="friend-name">${requester}</span>
                    </div>
                    <div style="display:flex; gap:4px;">
                        <button class="btn-action-friend" style="background:#00ff88; color:#000;" onclick="acceptFriend('${requester}')">TERIMA</button>
                        <button class="btn-action-friend" style="background:#ff007f;" onclick="rejectFriend('${requester}')">TOLAK</button>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    }

    function acceptFriend(requester) {
        dbFriends.child(activeUser.username).child('list').child(requester).set(true);
        dbFriends.child(requester).child('list').child(activeUser.username).set(true);
        dbFriends.child(activeUser.username).child('requests').child(requester).remove();
        alert("Sekarang Anda berteman dengan " + requester);
        loadFriendRequests();
    }

    function rejectFriend(requester) {
        dbFriends.child(activeUser.username).child('requests').child(requester).remove();
        loadFriendRequests();
    }

    function startPrivateChat(targetUser) {
        closeFriendsModal();
        currentChatMode = "PERSONAL";
        activeDMPartner = targetUser;

        const sorted = [activeUser.username, targetUser].sort();
        const roomId = `${sorted[0]}_${sorted[1]}`;
        activeRefPath = `direct_messages/${roomId}`;

        document.getElementById('chatTitleHeader').innerText = `DM: ${targetUser}`;
        switchChatRoom(activeRefPath);
    }

    function switchChatRoom(path) {
        if (dbChat) dbChat.off();
        document.getElementById('chatLogs').innerHTML = '';
        dbChat = firebase.database().ref(path);

        dbChat.limitToLast(60).on('child_added', (snapshot) => {
            renderMessage(snapshot.key, snapshot.val());
        });

        dbChat.limitToLast(60).on('child_changed', (snapshot) => {
            renderMessage(snapshot.key, snapshot.val());
        });

        dbChat.on('child_removed', (snapshot) => {
            const el = document.getElementById(`msg-${snapshot.key}`);
            if (el) el.remove();
        });
    }

    function handleMediaUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) { 
            alert("File terlalu besar! Maksimal ukuran 2 MB.");
            return;
        }

        const isVideo = file.type.startsWith('video/');
        const reader = new FileReader();

        reader.onload = function(e) {
            const base64Data = e.target.result;
            const payload = {
                user: activeUser.username,
                avatar: activeUser.avatar,
                mediaData: base64Data,
                isMedia: true,
                mediaType: isVideo ? 'video' : 'image',
                timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
            };

            if (selectedReplyData) {
                payload.replyTo = selectedReplyData;
            }

            dbChat.push(payload);
            playBeepSound('send');
            cancelReply();
        };

        reader.readAsDataURL(file);
        event.target.value = ''; 
    }

    function openTeamChat() {
        if (!activeUser) {
            openAuthModal();
            return;
        }
        updateChatHeaderProfile();

        currentChatMode = "GLOBAL";
        activeRefPath = "team_chat_messages";
        document.getElementById('chatTitleHeader').innerText = "T'chat";
        switchChatRoom(activeRefPath);

        document.getElementById('chatModal').style.display = 'flex';
        document.getElementById('chatText').focus();
    }

    function playBeepSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'send') {
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            }
        } catch(e) {}
    }

    const userColors = [
        '#00f0ff', '#ff007f', '#00ff88', '#ffb703', 
        '#a855f7', '#ff4d6d', '#3a86ff', '#fb5607', 
        '#70e000', '#ff006e', '#8338ec', '#00b4d8'
    ];

    function getUserColor(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        return userColors[Math.abs(hash) % userColors.length];
    }

    function formatChatMessage(text) {
        if (!text) return '';
        let formatted = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        formatted = formatted.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
        formatted = formatted.replace(/_(.*?)_/g, '<em>$1</em>');
        formatted = formatted.replace(/`(.*?)`/g, '<code>$1</code>');

        const urlPattern = /(https?:\/\/[^\s]+)/g;
        formatted = formatted.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener">$1</a>');

        return formatted;
    }

    function toggleStickerPicker() {
        const picker = document.getElementById('stickerPicker');
        picker.style.display = (picker.style.display === 'grid') ? 'none' : 'grid';
    }

    function openReactionPicker(msgKey) {
        window.targetMsgKeyForReaction = msgKey;
        toggleStickerPicker();
    }

    function toggleReaction(msgKey, emoji) {
        if (!activeUser) return;
        
        const user = activeUser.username;
        const reactionRef = dbChat.child(msgKey).child('reactions').child(emoji);

        reactionRef.once('value', (snapshot) => {
            let users = snapshot.val() || [];
            
            if (users.includes(user)) {
                users = users.filter(u => u !== user);
                if (users.length === 0) {
                    reactionRef.remove();
                } else {
                    reactionRef.set(users);
                }
            } else {
                users.push(user);
                reactionRef.set(users);
            }
        });
    }

    function setReplyToMessage(user, text) {
        selectedReplyData = { user: user.toUpperCase(), text };
        const previewBox = document.getElementById('replyPreview');
        const previewText = document.getElementById('replyPreviewText');
        
        previewText.innerHTML = `Membalas <b>${user.toUpperCase()}</b>: "${text}"`;
        previewBox.style.display = 'flex';
        document.getElementById('chatText').focus();
    }

    function cancelReply() {
        selectedReplyData = null;
        document.getElementById('replyPreview').style.display = 'none';
    }

    function renderMessage(key, data) {
        const chatLogs = document.getElementById('chatLogs');
        const currentUser = activeUser ? activeUser.username : '';
        
        const username = (data.user || 'USER').toUpperCase();
        const isSelf = (username === currentUser && currentUser !== '');
        const avatarUrl = data.avatar || ("https://api.dicebear.com/7.x/bottts/svg?seed=" + username);

        let wrapperDiv = document.getElementById(`msg-${key}`);
        
        if (!wrapperDiv) {
            wrapperDiv = document.createElement('div');
            wrapperDiv.className = `chat-msg-wrapper ${isSelf ? 'own-msg' : 'other-msg'}`;
            wrapperDiv.id = `msg-${key}`;
        } else {
            wrapperDiv.innerHTML = ''; 
        }

        const color = getUserColor(username);
        const isAdmin = (username === NAMA_ADMIN_RESMI);
        const badgeAdmin = isAdmin 
            ? `<span style="background: #ff007f; color: #ffffff; font-size: 8px; padding: 1px 6px; border-radius: 4px; margin-left: 5px; font-weight: 900; letter-spacing: 1px; box-shadow: 0 0 6px var(--pink-neon);">ADMIN</span>` 
            : '';

        const safeUser = username.replace(/'/g, "\\'");
        const safeText = (data.msg || (data.isSticker ? data.sticker : (data.isMedia ? '[Media]' : ''))).replace(/'/g, "\\'").replace(/\n/g, ' ');

        const avatarImg = document.createElement('img');
        avatarImg.className = 'msg-avatar';
        avatarImg.src = avatarUrl;
        avatarImg.alt = username;
        avatarImg.onclick = () => viewFullsizeImage(avatarUrl, username);

        const contentContainer = document.createElement('div');
        contentContainer.className = 'msg-content-container';

        const headerInfoDiv = document.createElement('div');
        headerInfoDiv.className = 'msg-header-info';
        headerInfoDiv.innerHTML = `
            <span class="sender" style="color: ${color};">${username}${badgeAdmin}</span>
            <span class="time-stamp">${data.timestamp || ''}</span>
            <div class="msg-actions">
                <span class="btn-action-msg" title="Beri Reaksi" onclick="openReactionPicker('${key}')">😊</span>
                <span class="btn-action-msg" title="Balas Pesan Ini" onclick="setReplyToMessage('${safeUser}', '${safeText}')">↩️</span>
            </div>
        `;

        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-msg';

        let replyHTML = '';
        if (data.replyTo) {
            replyHTML = `
                <div class="reply-quote-box">
                    <span class="reply-author">↩️ ${data.replyTo.user.toUpperCase()}</span>
                    <span class="reply-text">${formatChatMessage(data.replyTo.text)}</span>
                </div>
            `;
        }

        let contentHTML = '';
        if (data.isSticker) {
            contentHTML = `<span class="msg-sticker">${data.sticker}</span>`;
        } else if (data.isMedia) {
            if (data.mediaType === 'image') {
                contentHTML = `<img class="chat-media-img" src="${data.mediaData}" onclick="viewFullsizeImage('${data.mediaData}', '${username}')" />`;
            } else if (data.mediaType === 'video') {
                contentHTML = `<video class="chat-media-video" src="${data.mediaData}" controls></video>`;
            }
        } else {
            contentHTML = `<span class="msg-content">${formatChatMessage(data.msg)}</span>`;
        }

        msgDiv.innerHTML = `${replyHTML}${contentHTML}`;

        const reactionsContainer = document.createElement('div');
        reactionsContainer.className = 'msg-reactions-container';

        if (data.reactions) {
            Object.keys(data.reactions).forEach(emoji => {
                const users = data.reactions[emoji] || [];
                if (users.length > 0) {
                    const isMyReaction = users.includes(currentUser);
                    const badge = document.createElement('div');
                    badge.className = `reaction-badge ${isMyReaction ? 'active-user' : ''}`;
                    badge.title = `Direaksi oleh: ${users.join(', ')}`;
                    badge.innerHTML = `<span>${emoji}</span><span class="reaction-count">${users.length}</span>`;
                    
                    badge.onclick = () => toggleReaction(key, emoji);
                    reactionsContainer.appendChild(badge);
                }
            });
        }

        contentContainer.appendChild(headerInfoDiv);
        contentContainer.appendChild(msgDiv);
        contentContainer.appendChild(reactionsContainer); 

        wrapperDiv.appendChild(avatarImg);
        wrapperDiv.appendChild(contentContainer);

        if (!document.getElementById(`msg-${key}`)) {
            chatLogs.appendChild(wrapperDiv);
        }
        
        chatLogs.scrollTop = chatLogs.scrollHeight;
    }

    function sendSticker(stickerChar) {
        if (!activeUser) return;

        if (window.targetMsgKeyForReaction) {
            toggleReaction(window.targetMsgKeyForReaction, stickerChar);
            window.targetMsgKeyForReaction = null;
            document.getElementById('stickerPicker').style.display = 'none';
            return;
        }

        const payload = {
            user: activeUser.username,
            avatar: activeUser.avatar,
            sticker: stickerChar,
            isSticker: true,
            timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
        };

        if (selectedReplyData) {
            payload.replyTo = selectedReplyData;
        }

        dbChat.push(payload);
        playBeepSound('send');
        cancelReply();
        document.getElementById('stickerPicker').style.display = 'none';
    }

    function sendChatMessage() {
        if (!activeUser) return;
        const textInput = document.getElementById('chatText');
        const messageText = textInput.value.trim();

        if (messageText) {
            const payload = {
                user: activeUser.username,
                avatar: activeUser.avatar,
                msg: messageText,
                timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
            };

            if (selectedReplyData) {
                payload.replyTo = selectedReplyData;
            }

            dbChat.push(payload);
            playBeepSound('send');
            textInput.value = '';
            textInput.style.height = '40px';
            cancelReply();
            document.getElementById('stickerPicker').style.display = 'none';
        }
    }

    function clearAllChat() {
        if (!activeUser || activeUser.username !== NAMA_ADMIN_RESMI) {
            alert("🚫 AKSES DITOLAK! Hanya Admin yang bisa mereset obrolan.");
            return;
        }

        if (confirm("Yakin ingin menghapus seluruh obrolan chat ini?")) {
            dbChat.remove();
            document.getElementById('chatLogs').innerHTML = '';
        }
    }

    function handleChatKey(e) {
        if (e.key === 'Enter') {
            if (e.shiftKey) {
                return;
            } else {
                e.preventDefault();
                sendChatMessage();
            }
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            if (document.getElementById('imageViewerModal').style.display === 'flex') {
                closeImageViewer();
            } else if (document.getElementById('friendsModal').style.display === 'flex') {
                closeFriendsModal();
            } else if (document.getElementById('registerModal').style.display === 'flex') {
                closeRegisterModal();
            } else if (document.getElementById('profileModal').style.display === 'flex') {
                closeProfileModal();
            }
        }
    });
</script>
</body>
</html>
