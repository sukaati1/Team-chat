<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only dark">
    <title>T'Chat Room - Independent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            color-scheme: only dark !important;
            --blue-electric: #00d2ff;
            --purple-neon: #a855f7;
            --purple-bright: #d8b4fe;
            --cyan-neon: #00f0ff;
            --lavender-border: #c89eff;
            --lavender-bg: rgba(147, 112, 219, 0.15);
        }

        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            padding: 20px;
            background-color: #030308;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        .chat-modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .auth-modal {
            position: relative;
            width: 100%;
            max-width: 400px;
            background: rgba(10, 8, 25, 0.9);
            border-radius: 20px;
            border: 2px solid var(--lavender-border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .auth-input-group { display: flex; flex-direction: column; gap: 6px; }
        .auth-input-group label { font-size: 11px; color: var(--purple-bright); font-family: 'Orbitron'; font-weight: 800; }
        .auth-input-group input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: var(--cyan-neon);
            padding: 12px;
            border-radius: 10px;
            outline: none;
            font-family: 'JetBrains Mono', monospace;
        }

        button {
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            border-radius: 15px;
            border: 1px solid var(--lavender-border);
            background: var(--lavender-bg);
            color: #fff;
            padding: 12px 18px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 12px var(--purple-neon);
        }

        .chat-container {
            position: relative; z-index: 2;
            width: 100%; max-width: 700px; height: 88vh;
            background: rgba(10, 8, 25, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 24px;
            border: 2px solid var(--lavender-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
        }

        .chat-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(200, 158, 255, 0.2);
            padding-bottom: 12px;
        }

        .chat-header h2 {
            margin: 0; font-family: 'Orbitron'; font-size: 22px;
            color: var(--cyan-neon);
            letter-spacing: 2px;
        }

        .chat-body {
            flex: 1; overflow-y: auto; border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 14px; padding: 14px; background: rgba(0, 0, 0, 0.4);
            display: flex; flex-direction: column; gap: 12px;
        }

        .chat-msg-wrapper { display: flex; gap: 10px; width: 100%; }
        .chat-msg-wrapper.own-msg { flex-direction: row-reverse; }

        .msg-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid var(--purple-bright); }
        .chat-msg {
            background: rgba(35, 30, 50, 0.8);
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            word-break: break-word;
            max-width: 75%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .chat-msg-wrapper.own-msg .chat-msg {
            background: rgba(80, 40, 110, 0.8);
            border-color: rgba(200, 158, 255, 0.2);
        }

        .chat-footer { display: flex; gap: 8px; align-items: center; }
        .chat-footer textarea {
            flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(168, 85, 247, 0.4);
            color: #fff; padding: 10px; border-radius: 12px; height: 42px; resize: none;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>

<video class="bg-video" autoplay loop muted playsinline disablepictureinpicture>
    <source src="./gb.mp4" type="video/mp4">
</video>

<!-- AUTH MODAL -->
<div class="chat-modal-overlay" id="authModal">
    <div class="auth-modal">
        <h3 style="margin: 0; text-align: center; font-family: 'Orbitron'; color: var(--cyan-neon);">LOGIN T'CHAT</h3>
        <div class="auth-input-group">
            <label>USER ID</label>
            <input type="text" id="loginUser" placeholder="Masukkan User ID..." oninput="this.value = this.value.toUpperCase()">
        </div>
        <div class="auth-input-group">
            <label>PASSWORD</label>
            <input type="password" id="loginPass" placeholder="Masukkan Password...">
        </div>
        <button onclick="submitLogin()">MASUK CHAT 🔥</button>
    </div>
</div>

<!-- CHAT ROOM -->
<div class="chat-container" id="chatRoom" style="display: none;">
    <div class="chat-header">
        <h2>T'CHAT ROOM</h2>
        <button onclick="logoutChat()">LOGOUT</button>
    </div>

    <div class="chat-body" id="chatLogs"></div>

    <div class="chat-footer">
        <textarea id="chatText" placeholder="Tulis pesan..." onkeydown="handleChatKey(event)"></textarea>
        <button onclick="sendChatMessage()">KIRIM 🔥</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="script.js"></script>

</body>
</html>
