<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Team Chat Simpel</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 30px auto; padding: 10px; }
    #chat { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    .msg { margin-bottom: 8px; }
    .input-box { display: flex; gap: 5px; }
    input { padding: 8px; font-size: 14px; }
    #user { width: 30%; }
    #text { flex: 1; }
    button { padding: 8px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Team Chat (Tanpa Server)</h2>
  <div id="chat"></div>

  <div class="input-box">
    <input type="text" id="user" placeholder="Nama">
    <input type="text" id="text" placeholder="Pesan...">
    <button onclick="sendMsg()">Kirim</button>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Konfigurasi Database Publik Demo (Siap Pakai)
    const firebaseConfig = {
      databaseURL: "https://testing-chat-simple-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("messages");

    const chat = document.getElementById('chat');
    const user = document.getElementById('user');
    const text = document.getElementById('text');

    // Kirim Pesan
    function sendMsg() {
      if (user.value && text.value) {
        db.push({
          username: user.value,
          message: text.value
        });
        text.value = '';
      }
    }

    // Terima Pesan Baru Otomatis (Real-time)
    db.on('child_added', (snapshot) => {
      const data = snapshot.val();
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<b>${data.username}:</b> ${data.message}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    });
  </script>
</body>
</html>
